# Managed by .ores-lint/ - regenerated by the rollout script.
name: ores-lint

on:
  pull_request:
  workflow_dispatch:
  # Add `push:` here once this repo's lint debt is paid down.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect project types
        id: detect
        run: |
          { [ -f package.json ] || git ls-files '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' | grep -q .; } \
            && echo "js=true" >> "$GITHUB_OUTPUT" || echo "js=false" >> "$GITHUB_OUTPUT"
          { [ -f Cargo.toml ] || git ls-files '*.rs' | grep -q .; } \
            && echo "rs=true" >> "$GITHUB_OUTPUT" || echo "rs=false" >> "$GITHUB_OUTPUT"
          { [ -f pubspec.yaml ] || git ls-files '*.dart' | grep -q .; } \
            && echo "dart=true" >> "$GITHUB_OUTPUT" || echo "dart=false" >> "$GITHUB_OUTPUT"
          { [ -f gleam.toml ] || git ls-files '*.gleam' | grep -q .; } \
            && echo "gleam=true" >> "$GITHUB_OUTPUT" || echo "gleam=false" >> "$GITHUB_OUTPUT"

      # Node is the runner for ESLint and for the cross-language require-send
      # scanner, so it is installed whenever any supported language is present.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.detect.outputs.js == 'true' || steps.detect.outputs.rs == 'true' || steps.detect.outputs.dart == 'true' || steps.detect.outputs.gleam == 'true'
        with:
          node-version: '22'

      # ESLint is a global tool here, not a repo dependency - so this job never
      # runs `npm install` and never needs the repo's node_modules.
      - name: Install eslint globally
        if: steps.detect.outputs.js == 'true'
        run: npm i -g eslint typescript-eslint

      - name: Install clippy
        if: steps.detect.outputs.rs == 'true'
        run: rustup component add clippy || true

      # Dart/Gleam SDKs are optional. When absent, dart.sh / gleam.sh skip
      # with an actionable message; require-send.mjs still runs via Node.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: steps.detect.outputs.dart == 'true'
        continue-on-error: true

      - name: Run ores-lint
        run: sh .ores-lint/lint.sh
        env:
          # Warn-only. Set to 1 here to make lint findings fail this repo's CI.
          ORES_LINT_STRICT: '0'

  repair-commercial-dart:
    name: One-shot trusted-branch Dart repair
    if: >-
      github.repository == 'fiducia-cloud/fiducia-flutter' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/DEN-2843-android-release-signing'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/DEN-2843-android-release-signing
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Repair the five literal dollar signs and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/commercial/commercial_intake.dart')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "'Under $500/month'": r"'Under \$500/month'",
              "'$500–$2,000/month'": r"'\$500–\$2,000/month'",
              "'$2,000–$10,000/month'": r"'\$2,000–\$10,000/month'",
              "'$10,000–$50,000/month'": r"'\$10,000–\$50,000/month'",
              "'$50,000+/month'": r"'\$50,000+/month'",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          flutter pub get --enforce-lockfile
          dart format \
            lib/src/commercial/commercial_intake.dart \
            test/commercial_intake_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/src/commercial/commercial_intake.dart \
            test/commercial_intake_test.dart
          flutter analyze
          flutter test
          git diff --check

      - name: Restore managed CI, remove temporary CI, and commit explicit paths
        shell: bash
        env:
          BRANCH_NAME: fix/DEN-2843-android-release-signing
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout origin/main -- .github/workflows/ores-lint.yml
          git rm -- .github/workflows/repair-commercial-dart.yml
          git add -- \
            .github/workflows/ores-lint.yml \
            lib/src/commercial/commercial_intake.dart \
            test/commercial_intake_test.dart

          git diff --cached --check
          git diff --cached --name-only | grep -Fx \
            '.github/workflows/ores-lint.yml'
          git diff --cached --name-only | grep -Fx \
            '.github/workflows/repair-commercial-dart.yml'
          git diff --cached --name-only | grep -Fx \
            'lib/src/commercial/commercial_intake.dart'
          unexpected="$(
            git diff --cached --name-only |
              grep -Ev '^(\.github/workflows/(ores-lint|repair-commercial-dart)\.yml|lib/src/commercial/commercial_intake\.dart|test/commercial_intake_test\.dart)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'Refusing unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-2843): repair commercial intake Dart source'
          git push origin "HEAD:${BRANCH_NAME}"
