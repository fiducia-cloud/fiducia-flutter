name: Temporary commercial base-class repair

on:
  push:
    branches:
      - alexander-mills/den-1390-commercial-intake-flutter

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Make the submission-state helper extensible within the library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/commercial/commercial_intake.dart')
          text = path.read_text()
          before = 'abstract base class _SubmittingState<T extends StatefulWidget>'
          after = 'abstract class _SubmittingState<T extends StatefulWidget>'
          if before not in text:
            raise SystemExit('expected base-class declaration not found')
          path.write_text(text.replace(before, after, 1))
          PY
      - name: Commit the focused repair and remove this workflow
        run: |
          rm .github/workflows/_temporary_fix_commercial_base.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/commercial/commercial_intake.dart
          git add -u .github/workflows/_temporary_fix_commercial_base.yml
          git diff --cached --check
          git commit -m 'fix(intake): make shared submission state extensible'
          git push origin "HEAD:${GITHUB_REF_NAME}"
